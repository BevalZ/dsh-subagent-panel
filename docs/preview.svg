<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img">
  <title>Subagent panel as a right-sidebar tab</title>
  <rect width="640" height="320" fill="#ffffff"/>
  <!-- conversation column -->
  <rect x="16" y="16" width="392" height="288" rx="10" fill="#f7f7f8" stroke="#e3e3e6"/>
  <rect x="36" y="40" width="180" height="10" rx="5" fill="#d9d9de"/>
  <rect x="36" y="62" width="300" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="80" width="260" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="118" width="140" height="8" rx="4" fill="#d9d9de"/>
  <rect x="36" y="136" width="300" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="154" width="220" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="230" width="340" height="54" rx="10" fill="#ffffff" stroke="#e3e3e6"/>

  <!-- sidebar divider -->
  <line x1="424" y1="16" x2="424" y2="304" stroke="#e3e3e6"/>

  <!-- sidebar panel -->
  <rect x="440" y="16" width="184" height="288" rx="10" fill="#ffffff" stroke="#e3e3e6"/>
  <!-- header row: hierarchy glyph, title, spinner, two icon buttons -->
  <g stroke="#1f6feb" stroke-width="1.6" fill="none">
    <rect x="452" y="30" width="6" height="4.6" rx="1.4" fill="#1f6feb" stroke="none"/>
    <path d="M455 34.6V37M449.8 37h10.4M449.8 37v2.6M460.2 37v2.6"/>
    <rect x="447.2" y="39.6" width="5.2" height="4.2" rx="1.3"/>
    <rect x="457.6" y="39.6" width="5.2" height="4.2" rx="1.3"/>
  </g>
  <rect x="468" y="31" width="42" height="9" rx="4.5" fill="#d9d9de"/>
  <circle cx="522" cy="35.5" r="5" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="24 8"/>
  <circle cx="542" cy="35.5" r="1.8" fill="#b9b9c0"/>
  <circle cx="556" cy="35.5" r="1.8" fill="#b9b9c0"/>
  <line x1="448" y1="52" x2="616" y2="52" stroke="#ececef"/>

  <!-- progress line -->
  <rect x="452" y="60" width="96" height="7" rx="3.5" fill="#ececef"/>

  <!-- row 1: running -->
  <rect x="448" y="78" width="168" height="34" rx="8" fill="#f7f7f8"/>
  <circle cx="461" cy="95" r="4.5" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="20 8"/>
  <rect x="472" y="86" width="72" height="8" rx="4" fill="#c9c9cf"/>
  <rect x="472" y="98" width="96" height="6" rx="3" fill="#e2e2e7"/>
  <rect x="596" y="89" width="6" height="5" rx="1" fill="#c9c9cf"/>
  <rect x="596" y="98" width="6" height="5" rx="1" fill="#c9c9cf"/>
  <circle cx="608" cy="95" r="3" fill="#8e8e96"/>

  <!-- row 2: completed (green) with drawer open -->
  <rect x="448" y="118" width="168" height="34" rx="8" fill="#f7f7f8"/>
  <circle cx="461" cy="135" r="4.5" fill="#1a7f37"/>
  <rect x="472" y="126" width="60" height="8" rx="4" fill="#c9c9cf"/>
  <rect x="472" y="138" width="84" height="6" rx="3" fill="#e2e2e7"/>
  <circle cx="608" cy="135" r="3" fill="#8e8e96"/>
  <!-- drawer -->
  <rect x="470" y="156" width="146" height="86" rx="8" fill="#fbfbfc" stroke="#e8e8ec"/>
  <rect x="478" y="164" width="100" height="6" rx="3" fill="#e2e2e7"/>
  <rect x="478" y="176" width="44" height="14" rx="7" fill="#ffffff" stroke="#e3e3e6"/>
  <rect x="528" y="176" width="60" height="14" rx="7" fill="#ffffff" stroke="#e3e3e6"/>
  <rect x="478" y="196" width="104" height="6" rx="3" fill="#ececef"/>
  <rect x="478" y="208" width="128" height="24" rx="6" fill="#f1f1f4"/>
  <rect x="484" y="214" width="96" height="5" rx="2.5" fill="#dcdce2"/>
  <rect x="484" y="224" width="72" height="5" rx="2.5" fill="#e6e6ec"/>

  <!-- row 3: ended abnormally (red) -->
  <rect x="448" y="250" width="168" height="34" rx="8" fill="none"/>
  <circle cx="461" cy="267" r="4.5" fill="#c32222"/>
  <rect x="472" y="258" width="54" height="8" rx="4" fill="#c9c9cf"/>
  <rect x="472" y="270" width="90" height="6" rx="3" fill="#f0c9c9"/>
  <rect x="596" y="261" width="6" height="5" rx="1" fill="#c9c9cf"/>
  <rect x="596" y="270" width="6" height="5" rx="1" fill="#c9c9cf"/>
  <circle cx="608" cy="267" r="3" fill="#8e8e96"/>

  <!-- row 4: idle (hollow grey) -->
  <rect x="448" y="288" width="168" height="12" rx="6" fill="none"/>
  <circle cx="461" cy="294" r="4" fill="none" stroke="#b9b9c0" stroke-width="1.5"/>
  <rect x="472" y="291" width="62" height="6" rx="3" fill="#e2e2e7"/>

  <!-- hidden bar -->
  <line x1="448" y1="234" x2="616" y2="234" stroke="#ececef"/>
  <rect x="452" y="240" width="86" height="6" rx="3" fill="#ececef"/>
  <rect x="586" y="238" width="30" height="10" rx="5" fill="none" stroke="#1f6feb"/>
</svg>
