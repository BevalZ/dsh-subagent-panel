<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
  <title>Subagent panel as right-sidebar cards, each with three live transcript lines</title>
  <rect width="640" height="360" fill="#ffffff"/>

  <!-- conversation column -->
  <rect x="16" y="16" width="352" height="328" rx="10" fill="#f7f7f8" stroke="#e3e3e6"/>
  <rect x="36" y="40" width="180" height="10" rx="5" fill="#d9d9de"/>
  <rect x="36" y="62" width="270" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="80" width="230" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="118" width="140" height="8" rx="4" fill="#d9d9de"/>
  <rect x="36" y="136" width="270" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="154" width="200" height="8" rx="4" fill="#e8e8ec"/>
  <rect x="36" y="270" width="300" height="54" rx="10" fill="#ffffff" stroke="#e3e3e6"/>

  <!-- sidebar divider -->
  <line x1="384" y1="16" x2="384" y2="344" stroke="#e3e3e6"/>

  <!-- panel header -->
  <g stroke="#1f6feb" stroke-width="1.6" fill="none">
    <rect x="400" y="28" width="6" height="4.6" rx="1.4" fill="#1f6feb" stroke="none"/>
    <path d="M403 32.6V35M397.8 35h10.4M397.8 35v2.6M408.2 35v2.6"/>
    <rect x="395.2" y="37.6" width="5.2" height="4.2" rx="1.3"/>
    <rect x="405.6" y="37.6" width="5.2" height="4.2" rx="1.3"/>
  </g>
  <rect x="416" y="29" width="42" height="9" rx="4.5" fill="#d9d9de"/>
  <circle cx="470" cy="33.5" r="5" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="24 8"/>
  <circle cx="556" cy="33.5" r="1.8" fill="#b9b9c0"/>
  <line x1="396" y1="50" x2="612" y2="50" stroke="#ececef"/>

  <!-- card 1: running, three lines -->
  <rect x="394" y="60" width="222" height="74" rx="10" fill="#ffffff" stroke="#e3e3e6"/>
  <circle cx="408" cy="74" r="4.5" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="20 8"/>
  <rect x="419" y="69" width="68" height="8" rx="4" fill="#c9c9cf"/>
  <rect x="524" y="69" width="16" height="5" rx="2.5" fill="#dcdce2"/>
  <rect x="546" y="70" width="54" height="5" rx="2.5" fill="#dcdce2"/>
  <rect x="419" y="86" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="86" width="160" height="5" rx="2.5" fill="#e2e2e7"/>
  <rect x="419" y="98" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="98" width="132" height="5" rx="2.5" fill="#e2e2e7"/>
  <rect x="419" y="110" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="110" width="148" height="5" rx="2.5" fill="#e2e2e7"/>

  <!-- card 2: completed (green), drawer open -->
  <rect x="394" y="142" width="222" height="74" rx="10" fill="#ffffff" stroke="#e3e3e6"/>
  <circle cx="408" cy="156" r="4.5" fill="#1a7f37"/>
  <rect x="419" y="151" width="56" height="8" rx="4" fill="#c9c9cf"/>
  <rect x="524" y="151" width="16" height="5" rx="2.5" fill="#dcdce2"/>
  <rect x="546" y="152" width="54" height="5" rx="2.5" fill="#dcdce2"/>
  <rect x="419" y="168" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="168" width="150" height="5" rx="2.5" fill="#e2e2e7"/>
  <rect x="419" y="180" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="180" width="120" height="5" rx="2.5" fill="#e2e2e7"/>
  <rect x="419" y="192" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="192" width="140" height="5" rx="2.5" fill="#e2e2e7"/>
  <!-- drawer under card 2 -->
  <rect x="406" y="222" width="206" height="52" rx="8" fill="#fbfbfc" stroke="#e8e8ec"/>
  <rect x="414" y="230" width="88" height="5" rx="2.5" fill="#e2e2e7"/>
  <rect x="414" y="242" width="42" height="13" rx="6.5" fill="#ffffff" stroke="#e3e3e6"/>
  <rect x="462" y="242" width="58" height="13" rx="6.5" fill="#ffffff" stroke="#e3e3e6"/>
  <rect x="414" y="261" width="180" height="6" rx="3" fill="#f1f1f4"/>

  <!-- card 3: ended abnormally (red) -->
  <rect x="394" y="284" width="222" height="60" rx="10" fill="#ffffff" stroke="#e3e3e6"/>
  <circle cx="408" cy="298" r="4.5" fill="#c32222"/>
  <rect x="419" y="293" width="52" height="8" rx="4" fill="#c9c9cf"/>
  <rect x="524" y="293" width="16" height="5" rx="2.5" fill="#dcdce2"/>
  <rect x="546" y="294" width="54" height="5" rx="2.5" fill="#f0c9c9"/>
  <rect x="419" y="310" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="310" width="138" height="5" rx="2.5" fill="#e2e2e7"/>
  <rect x="419" y="322" width="34" height="5" rx="2.5" fill="#8f8f97"/>
  <rect x="457" y="322" width="112" height="5" rx="2.5" fill="#e2e2e7"/>
</svg>
